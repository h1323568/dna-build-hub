name: 定时抓取配装数据

on:
  schedule:
    # 每 30 分钟抓取一次（GitHub 对排队任务的实际触发可能延迟数分钟）
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行抓取脚本
        run: python scraper.py --output data.json

      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新配装数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
